<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="javascript.js" defer></script>
  </head>
  <body>
    <header>
      <h2>My Library</h2>
      <button id="addBook">Show Add Book Form</button>
    </header>
    <section id="form-section" class="hidden">
      <form id="bookForm" method="dialog">
        <h3>Add a New Book</h3>

        <div>
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" required />
        </div>

        <div>
          <label for="author">Author:</label>
          <input type="author" id="author" name="author" required />
        </div>

        <div>
          <label for="pages">Pages:</label>
          <input type="number" id="pages" name="pages" min="1" required />
        </div>

        <div>
          <label for="read">
            <input type="checkbox" id="read" name="read" />
            I have read this book
          </label>
        </div>
        <div class="formBtns">
          <button type="button" id="cancel-btn">Cancel</button>
          <button type="submit" id="submitBook">Add Book</button>
        </div>
      </form>
    </section>
    <table>
      <caption>
        My Books
      </caption>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Pages</th>
          <th>Read</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="libraryBooks"></tbody>
    </table>
    <template id="delete-button-template"
      ><button class="deleteBook">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <title>trash-can-outline</title>
          <path
            d="M9,3V4H4V6H5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V6H20V4H15V3H9M7,6H17V19H7V6M9,8V17H11V8H9M13,8V17H15V8H13Z"
          />
        </svg></button
    ></template>
    <template id="readTemplate">
      <button id="readBtn">Read</button>
    </template>
    <template id="notReadTemplate">
      <button id="notRead">Not Read</button>
    </template>
  </body>
</html>
